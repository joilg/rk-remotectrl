PACKAGE_NAME="rk-remotectrl"
PACKAGE_VERSION="7.3"
AUTOINSTALL=yes
CLEAN="make -C $kernel_source_dir M=$dkms_tree/$PACKAGE_NAME/$PACKAGE_VERSION/build clean"
MAKE="make -C $kernel_source_dir M=$dkms_tree/$PACKAGE_NAME/$PACKAGE_VERSION/build modules --no-silent"
BUILT_MODULE_NAME="rk-remotectl"
BUILT_MODULE_LOCATION="."
DEST_MODULE_LOCATION="/updates/dkms"
